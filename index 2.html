<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InduServices — IA industrielle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#142033}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:250px;background:#071426;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:22px;letter-spacing:-.5px;padding:6px 10px 28px}.brand span{color:#38bdf8}.nav button{width:100%;border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px 12px;border-radius:10px;margin:2px 0}.nav button.active,.nav button:hover{background:#11243d;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.pill{padding:7px 11px;border-radius:999px;background:#e9f5ff;color:#0877b9;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e5ebf3;border-radius:16px;padding:18px;box-shadow:0 5px 18px rgba(20,32,51,.04)}.kpi .num{font-size:30px;font-weight:800;margin:8px 0}.muted{color:#718096;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#087ff5;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.secondary{background:#fff;color:#19304d;border:1px solid #d9e2ee;border-radius:10px;padding:10px 14px;font-weight:700}.danger{background:#fff2f2;color:#c53030;border:1px solid #ffd3d3;border-radius:10px;padding:10px 14px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf1f6;font-size:13px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf6ff;color:#0877b9;font-size:11px;font-weight:700;margin:3px}.priority{font-weight:800}.high{color:#d64545}.normal{color:#1d7a46}.panel{background:#fff;border:1px solid #e5ebf3;border-radius:16px;padding:20px}.emailbox{white-space:pre-wrap;background:#f8fafc;border:1px solid #e5ebf3;border-radius:12px;padding:15px;line-height:1.55;font-size:13px}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#f8fafc;border-radius:10px;padding:10px}.field b{display:block;font-size:11px;color:#718096;text-transform:uppercase;margin-bottom:4px}.modal{position:fixed;inset:0;background:rgba(5,15,28,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{background:#fff;width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px}.textarea{width:100%;min-height:230px;border:1px solid #dbe3ed;border-radius:12px;padding:14px;resize:vertical}.toast{position:fixed;right:20px;bottom:20px;background:#071426;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:30}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#061325,#0c2d4e)}.loginbox{width:min(430px,92%);background:#fff;padding:30px;border-radius:20px}.loginbox input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #d9e2ee;border-radius:10px}.hero{background:linear-gradient(120deg,#0b2340,#087ff5);color:#fff;border-radius:18px;padding:24px;margin-bottom:20px}.hero h2{margin:0 0 7px;font-size:25px}.empty{padding:35px;text-align:center;color:#718096}.list{display:grid;gap:10px}.listitem{padding:14px;border:1px solid #e5ebf3;border-radius:12px;background:#fff}.mobile-card{display:none}@media(max-width:900px){.side{width:72px;padding:18px 8px}.brand{font-size:0;text-align:center}.brand span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:24px}.main{margin-left:72px;width:calc(100% - 72px);padding:20px 14px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.table th:nth-child(n+4),.table td:nth-child(n+4){display:none}}@media(max-width:550px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.top h1{font-size:23px}.main{padding:16px 10px}.hero{padding:18px}.card{padding:15px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand" style="color:#071426;padding:0 0 16px">Indu<span>Services</span></div><h2>Connexion</h2><p class="muted">Démo SaaS industrielle</p><input id="email" value="demo@induservices.fr" placeholder="E-mail"><input id="password" value="demo1234" type="password" placeholder="Mot de passe"><button class="primary" style="width:100%" onclick="login()">Entrer dans InduServices</button><p class="muted" style="margin-top:14px">Compte démo : demo@induservices.fr / demo1234</p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Indu<span>Services</span></div><div class="nav"><button class="active" onclick="page('dashboard',this)">⌂ &nbsp; Tableau de bord</button><button onclick="page('requests',this)">✉ &nbsp; Demandes clients</button><button onclick="page('quotes',this)">€ &nbsp; Devis</button><button onclick="page('interventions',this)">⚙ &nbsp; Interventions</button><button onclick="page('tasks',this)">✓ &nbsp; Tâches</button><button onclick="page('clients',this)">◉ &nbsp; Clients</button><button onclick="page('documents',this)">▤ &nbsp; Documents</button></div><div style="position:absolute;bottom:20px;left:16px;right:16px"><button class="nav" style="border:0;background:#11243d;color:#fff;width:100%;padding:11px;border-radius:10px" onclick="logout()">Déconnexion</button></div></aside><main class="main"><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 style="margin:0">Nouvelle demande client</h2><button class="x" onclick="closeModal()">×</button></div><p class="muted">Colle ici un mail reçu. InduServices le qualifie, crée le dossier et prépare les actions sans inventer les informations absentes.</p><textarea id="mailtext" class="textarea"></textarea><div class="actions" style="margin-top:12px"><button class="primary" onclick="analyzeMail()">Analyser + classer automatiquement</button><button class="secondary" onclick="document.getElementById('mailtext').value=demoMail">Mettre le mail démo</button></div></div></div><div id="toast" class="toast"></div>
<script>
const demoMail=`Bonjour,\n\nNous aimerions que vous puissiez nous changer la pompe 24 dans l’unité détergent demain s’il vous plaît.\n\nSerait-il possible d’avoir un devis s’il vous plaît ?\n\nMerci d’avance.\n\nCordialement,\nService maintenance\nNorgal`;
let current='dashboard';
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');return d}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(d.ok){loginEl.classList.add('hidden');app.classList.remove('hidden');page('dashboard')}}catch(e){toast(e.message)}}
const loginEl=document.getElementById('login');
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function page(name,btn){current=name;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');render(name)}
async function render(name){
 let c=document.getElementById('content');
 if(name==='dashboard')return dashboard();
 if(name==='requests')return requests();
 if(name==='quotes')return generic('Devis','/api/quotes',['client','title','amount','status','created_at']);
 if(name==='interventions')return interventions();
 if(name==='tasks')return generic('Tâches','/api/tasks',['title','priority','status','request_id']);
 if(name==='clients')return generic('Clients','/api/clients',['name','sector','contact','email']);
 if(name==='documents')return generic('Documents','/api/documents',['name','type','status']);
}
async function dashboard(){let d=await api('/api/dashboard');document.getElementById('content').innerHTML=`<div class="top"><div><h1>Tableau de bord</h1><div class="muted">Pilotage administratif et opérationnel</div></div><div class="actions"><span class="pill">IA active</span><button class="primary" onclick="openModal()">+ Nouvelle demande</button></div></div><div class="hero"><h2>Demande client → IA → devis → intervention</h2><div>InduServices centralise les demandes, les classe et prépare les prochaines actions. La validation humaine reste obligatoire avant les actions sensibles.</div></div><div class="grid"><div class="card kpi"><div class="muted">Demandes clients</div><div class="num">${d.requests}</div><div class="muted">dossiers analysés</div></div><div class="card kpi"><div class="muted">À traiter</div><div class="num">${d.pending}</div><div class="muted">priorités à vérifier</div></div><div class="card kpi"><div class="muted">Devis</div><div class="num">${d.quotes}</div><div class="muted">créés / brouillons</div></div><div class="card kpi"><div class="muted">Interventions</div><div class="num">${d.interventions}</div><div class="muted">suivies dans l’outil</div></div></div><div class="section two"><div class="panel"><h2>Dernières demandes</h2>${d.recent.length?`<table class="table"><tr><th>Client</th><th>Demande</th><th>Priorité</th><th>Statut</th></tr>${d.recent.map(r=>`<tr onclick="openRequest(${r.id})" style="cursor:pointer"><td><b>${esc(r.client)}</b></td><td>${esc(r.subject)}</td><td class="priority ${r.priority==='Haute'?'high':'normal'}">${r.priority}</td><td>${r.status}</td></tr>`).join('')}</table>`:'<div class="empty">Aucune demande. Clique sur « Nouvelle demande ».</div>'}</div><div class="panel"><h2>Ce que l’IA fait</h2><div class="list"><div class="listitem"><b>1. Comprend le mail</b><div class="muted">Client, équipement, lieu, date, besoin de devis.</div></div><div class="listitem"><b>2. Classe le dossier</b><div class="muted">Maintenance, intervention, priorité et tags.</div></div><div class="listitem"><b>3. Prépare les actions</b><div class="muted">Devis, intervention, tâches et informations manquantes.</div></div><div class="listitem"><b>4. Ne fabrique pas les prix</b><div class="muted">Les données inconnues restent à compléter.</div></div></div></div></div>`}
async function requests(){let rs=await api('/api/requests');document.getElementById('content').innerHTML=`<div class="top"><div><h1>Demandes clients</h1><div class="muted">Boîte de réception intelligente</div></div><button class="primary" onclick="openModal()">+ Coller un mail</button></div><div class="panel">${rs.length?`<table class="table"><tr><th>Client</th><th>Objet</th><th>Équipement</th><th>Priorité</th><th>Statut</th></tr>${rs.map(r=>`<tr onclick="openRequest(${r.id})" style="cursor:pointer"><td><b>${esc(r.client)}</b></td><td>${esc(r.subject)}<div>${JSON.parse(r.tags||'[]').map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></td><td>${esc(r.equipment)}</td><td class="priority ${r.priority==='Haute'?'high':'normal'}">${r.priority}</td><td>${r.status}</td></tr>`).join('')}</table>`:'<div class="empty">Aucun mail analysé.</div>'}</div>`}
async function openRequest(id){let r=await api('/api/requests/'+id);document.getElementById('content').innerHTML=`<div class="top"><div><button class="secondary" onclick="page('requests')">← Demandes</button><h1 style="margin-top:12px">${esc(r.subject)}</h1><div class="muted">Dossier #${r.id} · ${esc(r.client)} · ${esc(r.created_at)}</div></div><div class="actions"><button class="secondary" onclick="draftReply(${r.id})">Préparer réponse</button><button class="primary" onclick="execute(${r.id})">Valider les actions</button></div></div><div class="two"><div class="panel"><h2>Mail original</h2><div class="emailbox">${esc(r.raw_email)}</div><h2 style="margin-top:18px">Analyse IA</h2><div class="fields"><div class="field"><b>Type</b>${esc(r.category)}</div><div class="field"><b>Priorité</b><span class="priority ${r.priority==='Haute'?'high':'normal'}">${r.priority}</span></div><div class="field"><b>Client</b>${esc(r.client)}</div><div class="field"><b>Équipement</b>${esc(r.equipment)}</div><div class="field"><b>Localisation</b>${esc(r.location)}</div><div class="field"><b>Date demandée</b>${esc(r.requested_date||'Non précisée')}</div></div><div style="margin-top:12px">${r.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div><div class="panel"><h2>Actions proposées</h2><div class="list">${r.actions.map((a,i)=>`<div class="listitem"><b>${i+1}. ${esc(a)}</b></div>`).join('')}</div><h2 style="margin-top:20px">Informations manquantes</h2>${r.missing_info.length?'<ul>'+r.missing_info.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<div class="muted">Aucune information manquante détectée.</div>'}<div class="card" style="margin-top:18px;background:#f8fafc"><b>Pourquoi ?</b><p class="muted">${esc(r.explanation)}</p></div><h2 style="margin-top:20px">Suite du dossier</h2>${r.quotes.length?r.quotes.map(q=>`<div class="listitem">💶 Devis · ${q.status} · ${Number(q.amount).toLocaleString('fr-FR')} €</div>`).join(''):''}${r.interventions.length?r.interventions.map(i=>`<div class="listitem">⚙️ Intervention · ${i.status} · ${i.date||'date à confirmer'}</div>`).join(''):''}</div></div>`}
async function execute(id){try{let d=await api('/api/requests/'+id+'/execute',{method:'POST'});toast('Dossier créé : '+(d.created||[]).join(' + '));openRequest(id)}catch(e){toast(e.message)}}
async function draftReply(id){try{let d=await api('/api/requests/'+id+'/reply',{method:'POST'});document.getElementById('modal').classList.remove('hidden');document.querySelector('.modalbox').innerHTML=`<div class="modalhead"><h2>Brouillon de réponse</h2><button class="x" onclick="closeModal()">×</button></div><p class="muted">À relire et envoyer manuellement.</p><textarea class="textarea" id="reply">${esc(d.draft)}</textarea><div class="actions" style="margin-top:12px"><button class="primary" onclick="navigator.clipboard.writeText(document.getElementById('reply').value);toast('Copié');closeModal()">Copier le mail</button><button class="secondary" onclick="closeModal()">Fermer</button></div>`}catch(e){toast(e.message)}}
async function interventions(){let x=await api('/api/interventions');document.getElementById('content').innerHTML=`<div class="top"><div><h1>Interventions</h1><div class="muted">Planning et suivi terrain</div></div></div><div class="panel">${x.length?`<table class="table"><tr><th>Date</th><th>Client</th><th>Intervention</th><th>Statut</th><th></th></tr>${x.map(i=>`<tr><td>${esc(i.date||'À confirmer')}</td><td>${esc(i.client)}</td><td>${esc(i.title)}<div class="muted">${esc(i.description||'')}</div></td><td>${esc(i.status)}</td><td>${i.status!=='Terminée'?`<button class="secondary" onclick="complete(${i.id})">Clôturer</button>`:'✓'}</td></tr>`).join('')}</table>`:'<div class="empty">Aucune intervention. Analyse un mail pour en créer une.</div>'}</div>`}
async function complete(id){let report=prompt('Compte-rendu d’intervention :','Intervention réalisée. Contrôles effectués et installation remise en service.');if(report===null)return;await api('/api/interventions/'+id+'/complete',{method:'POST',body:JSON.stringify({report})});toast('Intervention clôturée');render('interventions')}
async function generic(title,url,cols){let x=await api(url);document.getElementById('content').innerHTML=`<div class="top"><div><h1>${title}</h1><div class="muted">Données centralisées</div></div></div><div class="panel">${x.length?`<table class="table"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${x.map(r=>`<tr>${cols.map(c=>`<td>${esc(String(r[c]??''))}</td>`).join('')}</tr>`).join('')}</table>`:'<div class="empty">Aucune donnée.</div>'}</div>`}
function openModal(){document.getElementById('modal').classList.remove('hidden');document.getElementById('mailtext').value=demoMail}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.querySelector('.modalbox').innerHTML=`<div class="modalhead"><h2>Nouvelle demande client</h2><button class="x" onclick="closeModal()">×</button></div><p class="muted">Colle ici un mail reçu. InduServices le qualifie, crée le dossier et prépare les actions sans inventer les informations absentes.</p><textarea id="mailtext" class="textarea"></textarea><div class="actions" style="margin-top:12px"><button class="primary" onclick="analyzeMail()">Analyser + classer automatiquement</button><button class="secondary" onclick="document.getElementById('mailtext').value=demoMail">Mettre le mail démo</button></div>`;document.getElementById('mailtext').value=demoMail}
async function analyzeMail(){let text=document.getElementById('mailtext').value;try{let d=await api('/api/requests/analyze',{method:'POST',body:JSON.stringify({text})});closeModal();toast('Mail classé automatiquement');openRequest(d.id)}catch(e){toast(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
(async()=>{try{let m=await api('/api/me');if(m.authenticated){loginEl.classList.add('hidden');app.classList.remove('hidden');render('dashboard')}}catch(e){}})();
</script></body></html>
